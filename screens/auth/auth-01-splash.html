<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Splash · PingMe</title>
  <link rel="stylesheet" href="../kit.css" />
  <style>
    body { background: var(--brand-700); }
    .splash {
      position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(120% 70% at 50% 38%, #18b3c8 0%, var(--brand) 42%, var(--brand-700) 78%, #084f5b 100%);
      cursor: pointer; user-select: none;
    }
    .stage { position: relative; width: 120px; height: 120px; display: grid; place-items: center; margin-top: -40px; }
    .ring {
      position: absolute; inset: 0; border-radius: 34px; border: 2px solid rgba(255, 255, 255, 0.5);
      opacity: 0; animation: ping 2.4s cubic-bezier(0.2, 0.6, 0.3, 1) 0.9s infinite;
    }
    .ring:nth-child(2) { animation-delay: 1.5s; }
    .ring:nth-child(3) { animation-delay: 2.1s; }
    @keyframes ping { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(2.4); opacity: 0; } }
    .logo {
      position: relative; width: 104px; height: 104px; border-radius: 30px; background: #fff;
      display: grid; place-items: center; color: var(--brand);
      box-shadow: 0 24px 50px rgba(4, 52, 61, 0.35), inset 0 -4px 0 rgba(14, 143, 163, 0.08);
      animation: pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
    }
    .logo svg { width: 54px; height: 54px; animation: zap 0.5s ease-out 0.75s both; }
    .dot {
      position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%;
      background: var(--mint); border: 4px solid var(--brand);
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1s both;
    }
    @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes zap { 0% { transform: translateY(-14px) rotate(-12deg); opacity: 0; } 60% { transform: translateY(2px) rotate(3deg); opacity: 1; } 100% { transform: none; } }
    .word { margin: 34px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -0.035em; animation: rise 0.6s ease-out 1.1s both; }
    .tag { margin: 6px 0 0; font-size: 16px; color: rgba(255, 255, 255, 0.82); animation: rise 0.6s ease-out 1.3s both; }
    .bottom { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 28px); display: flex; flex-direction: column; align-items: center; gap: 14px; animation: rise 0.6s ease-out 1.6s both; }
    .loader { width: 120px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
    .loader span { display: block; height: 100%; width: 40%; border-radius: 4px; background: #fff; animation: load 1.2s ease-in-out infinite; }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    .hint { font-size: 13px; color: rgba(255, 255, 255, 0.7); }
    /* Later launches: static logo, no intro (AUTH-01 acceptance). */
    .static * { animation: none !important; }
    .static .ring { display: none; }
    .static .loader span { animation: load 1.2s ease-in-out infinite !important; }
    .replay { position: absolute; top: 12px; right: 16px; background: rgba(255, 255, 255, 0.14); color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
    .replay svg.i { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <main class="splash" id="splash" aria-label="PingMe is starting">
    <button class="replay" id="replay" type="button"><svg class="i" data-icon="refresh"></svg>Replay intro</button>
    <div class="stage" aria-hidden="true">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <div class="logo"><svg class="i" data-icon="bolt"></svg><span class="dot"></span></div>
    </div>
    <h1 class="word">PingMe</h1>
    <p class="tag">Every order, always in the loop.</p>
    <div class="bottom">
      <div class="loader" role="progressbar" aria-label="Restoring your session"><span></span></div>
      <span class="hint">Tap anywhere to continue</span>
    </div>
  </main>
  <script src="../kit.js"></script>
  <script>
    const splash = document.getElementById("splash");
    // First open plays the intro; later opens show the static logo.
    if (PM.store.get("introSeen")) splash.classList.add("static");
    PM.store.set("introSeen", "1");
    splash.addEventListener("click", (e) => {
      if (e.target.closest("#replay")) {
        // Restart every animation by re-inserting the markup.
        splash.classList.remove("static");
        splash.innerHTML = splash.innerHTML;
        return;
      }
      PM.go("AUTH-02");
    });
  </script>
</body>
</html>
