<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Order Tracking · PingMe</title>
  <link rel="stylesheet" href="../kit.css" />
  <link rel="stylesheet" href="../app.css" />
  <style>
    .content { padding-top: 4px; }
    .status-card .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .status-card .id { font-size: 12.5px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .status-card h1 { margin: 12px 0 4px; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; }
    .status-card .svc { margin: 0; font-size: 14px; color: var(--ink-2); }
    .eta { display: flex; align-items: center; gap: 12px; margin: 16px 0; padding: 12px 14px; border-radius: var(--r); background: var(--brand-50); }
    .eta .tile { width: 40px; height: 40px; background: #fff; }
    .eta small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--brand-700); }
    .eta b { font-size: 17px; letter-spacing: -0.01em; }
    .status-card.ready .eta { background: var(--success-50); }
    .status-card.ready .eta small { color: #047857; }
    .status-card.ready .eta .tile { color: var(--success); }

    .pass { text-align: center; padding: 20px; border: 1.5px dashed #6ee7b7; background: linear-gradient(180deg, #fff, #f0fdf8); }
    .pass h2 { margin: 0; font-size: 17px; }
    .pass p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); }
    .pass .qr { width: min(196px, 60vw); aspect-ratio: 1; margin: 16px auto 10px; padding: 12px; background: #fff; border-radius: 18px; box-shadow: var(--shadow); }
    .pass .qr svg { display: block; width: 100%; height: 100%; }
    .pass .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 700; letter-spacing: 0.08em; font-size: 15px; }
    .pass .hint { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
    .pass .hint svg.i { width: 14px; height: 14px; }

    .vendor .row { align-items: flex-start; }
    .vendor b { display: block; font-size: 16px; letter-spacing: -0.01em; }
    .vendor .addr { display: flex; gap: 4px; align-items: flex-start; margin-top: 2px; font-size: 13px; color: var(--ink-2); }
    .vendor .addr svg.i { width: 15px; height: 15px; margin-top: 2px; color: var(--ink-3); }
    .vendor .acts { display: flex; gap: 8px; flex: none; }
    .vendor .acts .icon-btn { width: 40px; height: 40px; color: var(--brand-700); background: var(--brand-50); border-color: transparent; }
    .vendor .buttons { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 16px; }
    .vendor .buttons .btn { height: 48px; font-size: 15px; }

    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline li { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding-bottom: 20px; }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
    .timeline li:last-child::before { display: none; }
    .timeline li.done::before { background: var(--brand); }
    .timeline .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--surface); color: #fff; }
    .timeline .dot svg.i { width: 15px; height: 15px; stroke-width: 3; }
    .timeline li.done .dot { background: var(--brand); border-color: var(--brand); }
    .timeline li.now .dot { border-color: var(--brand); box-shadow: 0 0 0 5px var(--brand-50); }
    .timeline li.now .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
    .timeline li.now.ready .dot { border-color: var(--success); box-shadow: 0 0 0 5px var(--success-50); }
    .timeline li.now.ready .dot::after { background: var(--success); }
    .timeline b { display: block; font-size: 15px; font-weight: 600; margin-top: 3px; }
    .timeline li.now b { color: var(--brand-700); }
    .timeline li.now.ready b { color: #047857; }
    .timeline li.todo b { color: var(--ink-3); font-weight: 500; }
    .timeline small { display: block; font-size: 12.5px; color: var(--ink-3); }

    .note { margin-top: 18px; }
    .note .who { display: block; font-weight: 700; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; }

    .facts { display: grid; gap: 10px; margin: 0; }
    .facts div { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; }
    .facts dt { color: var(--ink-2); }
    .facts dd { margin: 0; font-weight: 600; text-align: right; min-width: 0; }

    .rate { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #fffbeb, #fff); border-color: #fde68a; }
    .rate .grow { flex: 1; min-width: 0; }
    .rate b { display: block; }
    .rate .btn { width: auto; height: 40px; padding: 0 16px; font-size: 14px; flex: none; }
    .proto { display: block; margin: 20px auto 0; font-size: 12px; font-weight: 500; color: var(--ink-3); }

    /* Push banner when the status changes */
    .push { position: fixed; top: 8px; left: 10px; right: 10px; z-index: 30; display: flex; gap: 10px; padding: 12px; border-radius: 18px; background: rgba(255, 255, 255, 0.96); box-shadow: 0 12px 30px rgba(15, 23, 42, 0.2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transform: translateY(-140%); transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .push.show { transform: none; }
    .push .mark.sm { flex: none; width: 34px; height: 34px; }
    .push .grow { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
    .push b { color: var(--ink); }
    .push time { font-size: 11.5px; color: var(--ink-3); flex: none; }
  </style>
</head>
<body class="canvas">
  <div class="page">
    <header class="appbar sticky">
      <button class="icon-btn" type="button" aria-label="Back" id="back"><svg class="i" data-icon="back"></svg></button>
      <div class="title">Order Tracking</div>
      <button class="icon-btn" type="button" aria-label="Notifications" data-go="NOTI-01"><svg class="i" data-icon="bell"></svg><span class="dot"></span></button>
    </header>

    <main class="content" id="main"></main>
  </div>

  <div class="push" id="push" role="status" aria-live="polite">
    <span class="mark sm"><svg class="i" data-icon="bolt"></svg></span>
    <div class="grow" id="push-text"></div>
    <time>now</time>
  </div>

  <script src="../kit.js"></script>
  <script src="../data.js"></script>
  <script>
    const D = PM.data;
    const $ = (id) => document.getElementById(id);
    // This screen tracks drop-off orders; fall back to the first active one.
    let o = D.current();
    if (!o || o.type !== "drop") o = D.orders.find((x) => x.type === "drop" && D.active(x));
    const s = D.shops[o.shop];

    const headline = { created: "Order received", progress: "Processing your order", ready: "Ready for pickup", completed: "Order completed", cancelled: "Order cancelled" };
    // Past orders (opened from history) carry less detail; fill in what the screen shows.
    if (!o.times) o.times = [o.created, o.status === "cancelled" ? "Cancelled by the shop" : "Processed", o.status === "cancelled" ? "" : "Ready", o.updated];
    if (!o.note) o.note = o.status === "cancelled" ? "Sorry, we couldn't take this order. Nothing was charged." : "Thanks for choosing us! See you next time.";

    function render() {
      const ready = o.status === "ready";
      const done = o.status === "completed";
      const cancelled = o.status === "cancelled";
      const steps = D.steps(o);
      const times = o.times || [];
      $("main").innerHTML = `
        <section class="card status-card rise${ready ? " ready" : ""}">
          <div class="top">${D.pill(o)}<span class="id">${o.id}</span></div>
          <h1>${headline[o.status]}</h1>
          <p class="svc">${o.service} at ${s.name}</p>
          <div class="eta">
            <span class="tile"><svg class="i" data-icon="${cancelled ? "close" : ready || done ? "checkcircle" : "clock"}"></svg></span>
            <div><small>${cancelled ? "Cancelled" : done ? "Picked up" : ready ? "Ready since" : "Estimated ready"}</small><b>${cancelled || done ? (o.month ? o.updated : "Today, 6:20 PM") : ready ? "Today, 9:02 AM" : o.eta}</b></div>
          </div>
          <div class="stepmeta"><span>Step ${o.step} of 4</span><b>${D.percent(o)}% complete</b></div>
          ${D.stepbar(o)}
        </section>

        ${done && !o.rated ? `
        <section class="card rate rise" style="margin-top: 12px">
          <span class="tile amber"><svg class="i" data-icon="star"></svg></span>
          <div class="grow"><b>How was ${s.name}?</b><span class="meta">Your rating helps other customers.</span></div>
          <button class="btn primary" type="button" data-go="CTRK-04">Rate</button>
        </section>` : ""}

        ${ready ? `
        <section class="card pass rise" style="margin-top: 12px">
          <h2>Your pickup pass</h2>
          <p>Show this at the counter. The shop scans it to hand over your items.</p>
          <div class="qr">${D.qr(o.id)}</div>
          <div class="code">${o.id.replace("ORD", "PINGME")}-X99</div>
          <div class="hint"><svg class="i" data-icon="sparkle"></svg>Turn your brightness up if it doesn't scan</div>
        </section>` : ""}

        <section class="card vendor rise" style="margin-top: 12px">
          <div class="row">
            ${D.tile(s, "lg")}
            <div class="grow">
              <b class="ellipsis">${s.name}</b>
              <div class="addr"><svg class="i" data-icon="pin"></svg><span>${s.address}</span></div>
            </div>
            <div class="acts">
              <a class="icon-btn" href="tel:${s.phone.replace(/[^\d+]/g, "")}" aria-label="Call ${s.name}"><svg class="i" data-icon="call"></svg></a>
              <button class="icon-btn" type="button" aria-label="Message ${s.name}" id="msg"><svg class="i" data-icon="message"></svg></button>
            </div>
          </div>
          <div class="buttons">
            <a class="btn primary" href="https://maps.google.com/?q=${encodeURIComponent(s.address)}" target="_blank" rel="noopener"><svg class="i" data-icon="navigate"></svg>Navigate</a>
            <button class="btn secondary" type="button" data-go="SHOP-01">View Shop</button>
          </div>
        </section>

        <section class="section">
          <div class="section-head"><h2>Order lifecycle</h2><span class="pill plain">${o.id}</span></div>
          <div class="card">
            <ol class="timeline">
              ${steps.map((name, i) => {
                const n = i + 1;
                const state = cancelled ? (n === 1 ? "done" : "todo") : n < o.step || done ? "done" : n === o.step ? "now" : "todo";
                return `<li class="${state}${state === "now" && ready ? " ready" : ""}">
                  <span class="dot">${state === "done" ? '<svg class="i" data-icon="check"></svg>' : ""}</span>
                  <div><b>${name}</b><small>${done && n === 4 && !o.month ? "6:20 PM, Today" : times[i] || ""}</small></div>
                </li>`;
              }).join("")}
            </ol>
            <div class="alert info note">
              <svg class="i" data-icon="message"></svg>
              <span><span class="who">${s.name} · ${o.updated}</span>${o.note}</span>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-head"><h2>Order details</h2></div>
          <div class="card">
            <dl class="facts">
              <div><dt>Service</dt><dd>${o.service}</dd></div>
              <div><dt>Dropped off</dt><dd>${o.created}</dd></div>
              <div><dt>Amount</dt><dd>${D.money(o.amount)}</dd></div>
              <div><dt>Payment</dt><dd>${cancelled ? "Not charged" : done ? "Paid at counter" : "Pay at pickup"}</dd></div>
            </dl>
          </div>
        </section>

        ${done || cancelled ? "" : `<button class="text-btn proto" type="button" id="advance">Prototype: simulate the shop's next update</button>`}
      `;
      PM.hydrateIcons($("main"));
      $("msg").addEventListener("click", () => PM.toast(`Opening a message to ${s.name}`));
      const adv = $("advance");
      adv && adv.addEventListener("click", advance);
    }

    function push(html) {
      $("push-text").innerHTML = html;
      $("push").classList.add("show");
      setTimeout(() => $("push").classList.remove("show"), 3200);
    }

    function advance() {
      const next = { created: ["progress", 2], progress: ["ready", 3], ready: ["completed", 4] }[o.status];
      if (!next) return;
      [o.status, o.step] = next;
      o.updated = "now";
      if (o.status === "progress") o.times[1] = "Started just now";
      if (o.status === "ready") {
        o.times[1] = o.times[1].startsWith("Started") ? o.times[1] : "Started earlier";
        o.times[2] = "Ready just now";
        o.note = "All done! Show the pickup QR at the counter. We're open until 9 PM.";
        push(`<b>${s.name}</b><br />Your order ${o.id} is ready for pickup 🎉`);
      } else if (o.status === "completed") {
        o.note = "Thanks for choosing us! See you next time.";
        push(`<b>${s.name}</b><br />Order ${o.id} picked up. How did we do?`);
      } else {
        push(`<b>${s.name}</b><br />We've started on your order ${o.id}.`);
      }
      render();
    }

    // Back returns to wherever the order was opened from.
    $("back").addEventListener("click", () => PM.go(D.active(o) ? "CHOME-01" : "CTRK-03"));

    render();
  </script>
</body>
</html>
