<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orders · PingMe</title>
  <link rel="stylesheet" href="../kit.css" />
  <link rel="stylesheet" href="../app.css" />
  <style>
    .head { display: flex; align-items: center; gap: 12px; padding: 14px var(--gutter) 0; }
    .head h1 { flex: 1; min-width: 0; margin: 0; font-size: 26px; letter-spacing: -0.025em; }
    .head .btns { display: flex; gap: 8px; }
    .head .icon-btn[aria-pressed="true"] { border-color: var(--brand); color: var(--brand-700); background: var(--brand-50); }
    .searchbox { margin: 12px 0 0; }
    .searchbox[hidden] { display: none; }
    .filters { margin-top: 14px; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 16px 0 10px; }
    .bar h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .bar h2 .n { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--brand-50); color: var(--brand-700); font-size: 12.5px; line-height: 22px; text-align: center; }
    .sort { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 0; font-size: 13px; font-weight: 600; color: var(--ink-2); }
    .sort svg.i { width: 16px; height: 16px; }

    .oc { padding: 0; overflow: hidden; }
    .oc .body { display: block; padding: 14px 16px 12px; color: inherit; font-weight: inherit; text-decoration: none; }
    .oc .body:hover { text-decoration: none; background: #fbfdfe; }
    .oc .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .oc .id { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
    .oc .id b { display: block; font-size: 17px; letter-spacing: -0.01em; text-transform: none; color: var(--ink); font-variant-numeric: tabular-nums; }
    .oc .who { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .oc .who .grow { flex: 1; min-width: 0; }
    .oc .who b { display: block; font-size: 15.5px; }
    .oc .who .meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .oc .tag { flex: none; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--brand-50); color: var(--brand-700); font-size: 11.5px; font-weight: 700; line-height: 20px; }
    .oc .tag.Tailoring { background: #f5f3ff; color: #6d28d9; }
    .oc .tag.Repair { background: #fff1f2; color: #be123c; }
    .oc .amt { font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
    .oc .acts2 { padding: 12px 16px 14px; border-top: 1px solid var(--line-2); }
    .oc .acts2.one { grid-template-columns: minmax(0, 1fr); }
    .oc.flash { animation: flash 1.2s; }
    @keyframes flash { 0%, 100% { box-shadow: var(--shadow-sm); } 30% { box-shadow: 0 0 0 4px var(--brand-100); } }
    .oc.draft { border-style: dashed; border-color: #fcd34d; }
    #list .card + .card { margin-top: 12px; }
    .oc .who b.clamp { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    @media (max-width: 360px) {
      .oc .who .tile { display: none; }
      .oc .body, .oc .acts2 { padding-left: 14px; padding-right: 14px; }
    }
  </style>
</head>
<body class="canvas" data-mode="vendor">
  <div class="page tabbed">
    <header class="head">
      <h1>Orders</h1>
      <div class="btns">
        <button class="icon-btn" type="button" aria-label="Search orders" aria-pressed="false" id="search-btn"><svg class="i" data-icon="search"></svg></button>
        <button class="icon-btn" type="button" aria-label="Scan a pickup QR" data-go="VORD-06"><svg class="i" data-icon="scan"></svg></button>
      </div>
    </header>

    <main class="content">
      <div class="searchbox" id="searchbox" hidden>
        <label class="control search"><svg class="i" data-icon="search"></svg><input id="q" type="search" placeholder="Order no., customer or item" aria-label="Search orders" /></label>
      </div>
      <div class="chips scroll filters" id="filters" role="group" aria-label="Filter by status"></div>

      <div class="bar">
        <h2>Total orders <span class="n" id="count">0</span></h2>
        <button class="sort" type="button" id="sort"><svg class="i" data-icon="filter"></svg><span>Newest first</span></button>
      </div>
      <div id="list"></div>
    </main>

    <nav class="tabbar" data-tabbar="orders"></nav>
  </div>

  <script src="../kit.js"></script>
  <script src="../data.js"></script>
  <script src="../vendor.js"></script>
  <script>
    const V = PM.V;
    const $ = (id) => document.getElementById(id);
    const filters = [
      ["all", "All", () => true],
      ["active", "Active", V.active],
      ["created", "Created", (o) => o.status === "created"],
      ["progress", "In Progress", (o) => o.status === "progress"],
      ["ready", "Ready", (o) => o.status === "ready"],
      ["completed", "Completed", (o) => o.status === "completed"],
      ["draft", "Drafts", (o) => o.status === "draft"],
      ["cancelled", "Cancelled", (o) => o.status === "cancelled"],
    ];
    // The dashboard counters open this list pre-filtered.
    let filter = PM.store.get("vfilter") || "all";
    PM.store.set("vfilter", "");
    let newest = true;
    let q = "";

    function renderFilters() {
      $("filters").innerHTML = filters.map(([k, name, fn]) => `<button type="button" class="chip" data-f="${k}" aria-pressed="${k === filter}">${name} <span class="n">${V.orders.filter(fn).length}</span></button>`).join("");
      const on = $("filters").querySelector('[aria-pressed="true"]');
      on && on.scrollIntoView({ block: "nearest", inline: "center" });
    }

    function card(o) {
      const n = V.next[o.status];
      const first = (o.customer.name || "").split(" ")[0];
      let acts;
      if (o.status === "draft") acts = `<div class="acts2 one"><button class="btn primary" type="button" data-qr="${o.id}"><svg class="i" data-icon="qr"></svg>Generate Order QR</button></div>`;
      else if (n) acts = `<div class="acts2">
          <button class="btn secondary" type="button" data-notify="${o.id}"><svg class="i" data-icon="send"></svg>Notify</button>
          <button class="btn ${o.status === "ready" ? "success" : "primary"}" type="button" data-next="${o.id}">${n.label}<svg class="i" data-icon="${n.icon}"></svg></button>
        </div>`;
      else acts = "";
      return `
        <article class="card oc rise${o.status === "draft" ? " draft" : ""}" id="c-${o.id}">
          <a href="#" class="body" data-open="${o.id}">
            <div class="top"><span class="id">Order ID<b>#${o.id.slice(4)}</b></span>${V.pill(o)}</div>
            <div class="who">
              ${V.catTile(o.category)}
              <div class="grow">
                <b class="clamp">${V.esc(o.title)}</b>
                <span class="meta"><span class="tag ${o.category}">${o.category}</span><span class="ellipsis">${o.customer.name ? V.esc(o.customer.name) : "No customer yet"}</span></span>
              </div>
              <span class="amt">${PM.data.money(V.total(o))}</span>
            </div>
          </a>
          ${acts}
        </article>`;
    }

    function render() {
      renderFilters();
      const fn = filters.find((f) => f[0] === filter)[2];
      const needle = q.trim().toLowerCase();
      let rows = V.orders.filter(fn).filter((o) => !needle || [o.id, o.title, o.customer.name, o.category].join(" ").toLowerCase().includes(needle));
      if (!newest) rows = rows.slice().reverse();
      $("count").textContent = rows.length;
      $("list").innerHTML = rows.length
        ? rows.map(card).join("")
        : `<div class="card empty"><span class="badge-icon ring"><svg class="i" data-icon="${needle ? "search" : "inbox"}"></svg></span><h3>${needle ? "No matches" : "Nothing here"}</h3><p>${needle ? `No order matches "${V.esc(q.trim())}".` : "Orders with this status show up here."}</p></div>`;
      PM.hydrateIcons($("list"));
      PM.hydrateIcons($("filters"));
    }

    function flash(id) {
      const c = $("c-" + id);
      if (c) { c.classList.remove("rise"); c.classList.add("flash"); }
    }

    $("filters").addEventListener("click", (e) => {
      const b = e.target.closest("[data-f]");
      if (!b) return;
      filter = b.dataset.f;
      render();
    });
    $("sort").addEventListener("click", () => {
      newest = !newest;
      $("sort").querySelector("span").textContent = newest ? "Newest first" : "Oldest first";
      render();
    });
    $("search-btn").addEventListener("click", () => {
      const box = $("searchbox");
      box.hidden = !box.hidden;
      $("search-btn").setAttribute("aria-pressed", String(!box.hidden));
      if (!box.hidden) $("q").focus();
      else { q = ""; $("q").value = ""; render(); }
    });
    $("q").addEventListener("input", (e) => { q = e.target.value; render(); });

    $("list").addEventListener("click", (e) => {
      const el = e.target.closest("[data-open], [data-next], [data-notify], [data-qr]");
      if (!el) return;
      e.preventDefault();
      if (el.dataset.open) { PM.store.set("vorder", el.dataset.open); return PM.go("VORD-05"); }
      if (el.dataset.notify) return V.notifySheet(V.order(el.dataset.notify), () => {});
      if (el.dataset.qr) {
        const o = V.order(el.dataset.qr);
        V.setStatus(o, "created");
        render();
        flash(o.id);
        return PM.toast(o.customer.phone ? `QR generated. Tracking link sent to ${o.customer.name.split(" ")[0]}` : `QR generated for ${o.id}. The customer claims it by scanning`);
      }
      // Next step: move one status forward and update the card in place (VORD-R4).
      const o = V.order(el.dataset.next);
      const n = V.next[o.status];
      V.setStatus(o, n.to);
      const fn = filters.find((f) => f[0] === filter)[2];
      if (fn(o)) {
        $("c-" + o.id).outerHTML = card(o);
        PM.hydrateIcons($("c-" + o.id));
        flash(o.id);
        renderFilters();
      } else {
        render();
      }
      PM.toast(`${n.text}. ${(o.customer.name || "Customer").split(" ")[0]} notified by ${V.channel(o)}`);
    });

    render();
  </script>
</body>
</html>
